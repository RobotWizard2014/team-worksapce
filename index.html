<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Team Workspace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#f8fafc;height:100vh;display:flex}
.side{width:220px;background:#1e293b;border-inline-end:1px solid #334155;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.nav{padding:12px;background:transparent;color:#94a3b8;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:start}
.nav.active{background:#6366f1;color:#fff}
.main{flex:1;display:flex;flex-direction:column;height:100vh}
.view{display:none;flex:1;flex-direction:column;height:100%}
.view.active{display:flex}
.bar{height:56px;background:#111827;border-bottom:1px solid #334155;display:flex;align-items:center;padding:0 16px;gap:10px}
input,textarea{background:#1f2937;border:1px solid #334155;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px}
.btn{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:#1f2937;border:1px solid #334155}
.btn.ok{background:#10b981;color:#052e16}
iframe{width:100%;height:100%;border:none;flex:1;background:#fff}
.split{display:flex;flex:1}
.pane{flex:1;display:flex;flex-direction:column;border-inline-end:1px solid #334155}
.code{flex:1;background:#0b1120;color:#e2e8f0;font-family:monospace;font-size:14px;padding:16px;border:none;resize:none;direction:ltr}
.out{flex:1;background:#020617;color:#34d399;font-family:monospace;font-size:14px;padding:16px;white-space:pre-wrap;overflow:auto;direction:ltr}
.chat-box{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;background:#1e293b;border:1px solid #334155;padding:10px 14px;border-radius:14px;display:flex;flex-direction:column;gap:6px;align-self:flex-start}
.msg.me{background:#312e81;border-color:#6366f1;align-self:flex-end}
.chat-input{padding:14px 16px;background:#111827;border-top:1px solid #334155;display:flex;gap:10px}
</style>
</head>
<body>
<aside class="side">
<h3 id="t0" style="padding:8px">Team Workspace</h3>
<button id="t1" class="nav active" data-t="bubble">🫧 Bubble Map</button>
<button id="t2" class="nav" data-t="docs">📄 Google Docs</button>
<button id="t3" class="nav" data-t="html">🌐 HTML Studio</button>
<button id="t4" class="nav" data-t="py">🐍 Python Terminal</button>
<button id="t5" class="nav" data-t="group">💬 Group Chat</button>
<button id="langBtn" class="btn sec" style="margin-top:auto" onclick="toggleLang()">🌐 עברית</button>
</aside>
<main class="main">
<section id="v-bubble" class="view active"><iframe id="bf" src="bubble-map.html"></iframe></section>
<section id="v-docs" class="view">
<div class="bar">
<input id="url" placeholder="Paste Google Doc or URL..." style="width:280px">
<button class="btn" onclick="openDoc()">Open</button>
<button class="btn sec" onclick="sendItem('Doc',url.value.slice(0,25),url.value)">Send to Chat</button>
</div>
<div style="padding:24px;display:flex;gap:12px">
<button class="btn" onclick="openDoc('https://google.com')">Google Docs</button>
<button class="btn" onclick="openDoc('https://google.com')">Google Drive</button>
</div>
</section>
<section id="v-html" class="view">
<div class="bar">
<b style="margin-inline-end:auto">HTML Studio</b>
<button class="btn" onclick="sendItem('HTML','HTML Code',hc.value)">Send to Chat</button>
</div>
<div class="split">
<div class="pane"><textarea id="hc" class="code" oninput="hp.srcdoc=this.value"><h1>Hello!</h1></textarea></div>
<div class="pane"><iframe id="hp"></iframe></div>
</div>
</section>
<section id="v-py" class="view">
<div class="bar">
<b style="margin-inline-end:auto">Python Terminal</b>
<span id="ps">Ready</span>
<button class="btn ok" onclick="runPy()">▶ Run</button>
<button class="btn" onclick="sendItem('Python','Python Code',pc.value)">Send to Chat</button>
</div>
<div class="split">
<div class="pane"><textarea id="pc" class="code">print("Hello!")</textarea></div>
<div class="pane"><div id="po" class="out">Click Run...</div></div>
</div>
</section>
<section id="v-group" class="view">
<div class="bar">
<b id="t6" style="margin-inline-end:auto">💬 Team Group Chat</b>
<input id="meName" placeholder="Your name..." style="width:130px" onchange="localStorage.setItem('ws_me',this.value)">
<input id="rm" value="team-1" style="width:95px" onchange="loadChat()">
</div>
<div id="chatBox" class="chat-box"></div>
<div class="chat-input">
<input id="chatTxt" placeholder="Type a message..." style="flex:1" onkeydown="if(event.key==='Enter')sendMsg()">
<button id="t7" class="btn" onclick="sendMsg()">Send</button>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const DB="https://firebasedatabase.app";
$("meName").value=localStorage.getItem("ws_me")||"";
let lang=localStorage.getItem("ws_lang")||"en";
function toggleLang(){lang=lang==="en"?"he":"en";localStorage.setItem("ws_lang",lang);applyLang()}
function applyLang(){
const he=lang==="he";
document.documentElement.dir=he?"rtl":"ltr";
$("langBtn").textContent=he?"🌐 English":"🌐 עברית";
const w=he?["סביבת עבודה","🫧 מפת בועות","📄 גוגל דוקס","🌐 עורך HTML","🐍 פייתון","💬 צ׳אט קבוצתי","💬 צ׳אט קבוצתי","שלח"]:["Team Workspace","🫧 Bubble Map","📄 Google Docs","🌐 HTML Studio","🐍 Python Terminal","💬 Group Chat","💬 Team Group Chat","Send"];
w.forEach((txt,i)=>$("t"+i).textContent=txt);
$("meName").placeholder=he?"השם שלך...":"Your name...";
$("chatTxt").placeholder=he?"כתוב הודעה...":"Type a message...";
}
applyLang();
let py=null,pyL=false;
function initPy(){
if(py||pyL)return;pyL=true;$("ps").textContent="Loading...";
let s=document.createElement("script");
s.src="https://jsdelivr.net";
s.onload=()=>loadPyodide().then(p=>{py=p;$("ps").textContent="Ready"});
document.head.appendChild(s);
}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{
document.querySelectorAll(".nav,.view").forEach(x=>x.classList.remove("active"));
b.classList.add("active");$("v-"+b.dataset.t).classList.add("active");
if(b.dataset.t==="py")initPy();
});
$("hp").srcdoc=$("hc").value;
async function runPy(){
if(!py){initPy();return}
py.runPython("import sys,io\nsys.stdout=io.StringIO()");
try{await py.runPythonAsync($("pc").value);$("po").textContent=py.runPython("sys.stdout.getvalue()")||"Done"}
catch(e){$("po").textContent=e}
}
function openDoc(u){u=u||$("url").value.trim();if(u)window.open(u.startsWith("http")?u:"https://"+u,"_blank","width=1100,height=750")}
let msgs=JSON.parse(localStorage.getItem("ws_chat_team-1")||"[]");
function pushChat(){
localStorage.setItem("ws_chat_"+$("rm").value,JSON.stringify(msgs));drawChat();
fetch(DB+"/chat/"+encodeURIComponent($("rm").value)+".json",{method:"PUT",body:JSON.stringify(msgs)}).catch(()=>{});
}
async function loadChat(){
try{let r=await(await fetch(DB+"/chat/"+encodeURIComponent($("rm").value)+".json")).json();if(Array.isArray(r)){msgs=r;drawChat()}}catch(e){}
}
setInterval(loadChat,3000);
function who(){
let n=$("meName").value.trim();
if(!n){n=prompt(lang==="he"?"הכנס שם:":"Your name:")||"User";$("meName").value=n;localStorage.setItem("ws_me",n)}
return n;
}
function sendMsg(){
let t=$("chatTxt").value.trim();if(!t)return;
msgs.push({u:who(),t:t,ts:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});
$("chatTxt").value="";pushChat();
}
function sendItem(type,label,content){
if(!content)return;
msgs.push({u:who(),t:"Shared "+type+": "+label,item:{type,label,content},ts:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});
pushChat();document.querySelector("[data-t=group]").click();
}
window.addEventListener("message",e=>{if(e.data&&e.data.type==="SHARE_MAP")sendItem("Map",e.data.map.name||"Bubble Map",e.data.map)});
function drawChat(){
let box=$("chatBox"),me=$("meName").value.trim();box.innerHTML="";
msgs.forEach(m=>{
let d=document.createElement("div");d.className="msg"+(m.u===me?" me":"");
d.innerHTML=`<small style="color:#94a3b8"><b>${m.u}</b> • ${m.ts||""}</small><div>${m.t}</div>`;
if(m.item){
let b=document.createElement("button");b.className="btn ok";b.textContent="Open "+m.item.type;
b.onclick=()=>{
if(m.item.type==="Map"){document.querySelector("[data-t=bubble]").click();$("bf").contentWindow.postMessage({type:"LOAD_MAP",map:m.item.content},"*")}
else if(m.item.type==="Doc")openDoc(m.item.content);
else if(m.item.type==="HTML"){$("hc").value=m.item.content;$("hp").srcdoc=m.item.content;document.querySelector("[data-t=html]").click()}
else{$("pc").value=m.item.content;initPy();document.querySelector("[data-t=py]").click()}
};
d.appendChild(b);
}
box.appendChild(d);
});
box.scrollTop=box.scrollHeight;
}
drawChat();loadChat();
</script>
</body>
</html>
